services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PDH_DATABASE_USER:-pdh}
      POSTGRES_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      POSTGRES_DB: ${PDH_DATABASE_NAME:-pdh}
    volumes:
      - pdh_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: pdh-server:local
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      PDH_SERVER_HOST: 0.0.0.0
      PDH_SERVER_PORT: "8090"
      PDH_DATABASE_HOST: db
      PDH_DATABASE_PORT: "5432"
      PDH_DATABASE_USER: ${PDH_DATABASE_USER:-pdh}
      PDH_DATABASE_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      PDH_DATABASE_NAME: ${PDH_DATABASE_NAME:-pdh}
      PDH_DATABASE_SSLMODE: disable
      PDH_AUTH_JWTSECRET: ${PDH_AUTH_JWTSECRET:?Set PDH_AUTH_JWTSECRET in .env.docker}
    ports:
      - "8090:8090"
    volumes:
      - pdh_uploads:/app/uploads

volumes:
  pdh_database:
  pdh_uploads:
