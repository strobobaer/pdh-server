services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PDH_DATABASE_USER:-pdh}
      POSTGRES_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      POSTGRES_DB: ${PDH_DATABASE_NAME:-pdh}
    volumes:
      - pdh_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PDH_BUILD_COMMIT: ${PDH_BUILD_COMMIT:-unknown}
    image: pdh-server:local
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # In der Oberflaeche gepflegte Server-Einstellungen (Volume pdh_config)
      PDH_ENV_FILE: /app/config/pdh.env
      PDH_SERVER_HOST: 0.0.0.0
      PDH_SERVER_PORT: "8090"
      PDH_DATABASE_HOST: db
      PDH_DATABASE_PORT: "5432"
      PDH_DATABASE_USER: ${PDH_DATABASE_USER:-pdh}
      PDH_DATABASE_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      PDH_DATABASE_NAME: ${PDH_DATABASE_NAME:-pdh}
      PDH_DATABASE_SSLMODE: disable
      PDH_AUTH_JWTSECRET: ${PDH_AUTH_JWTSECRET:?Set PDH_AUTH_JWTSECRET in .env.docker}
      PDH_UPDATE_AGENT_URL: http://updater:8091
      PDH_UPDATE_AGENT_TOKEN: ${PDH_UPDATE_AGENT_TOKEN:?Set PDH_UPDATE_AGENT_TOKEN in .env.docker}
    ports:
      - "8090:8090"
    volumes:
      - pdh_uploads:/app/uploads
      - pdh_chat_files:/app/chat_files
      - pdh_backups:/app/backups
      - pdh_config:/app/config

  updater:
    build:
      context: .
      dockerfile: Dockerfile
      target: updater
    image: pdh-updater:local
    restart: unless-stopped
    environment:
      PDH_UPDATE_LISTEN: 0.0.0.0:8091
      PDH_UPDATE_MODE: docker
      PDH_UPDATE_REPO_DIR: /repo
      PDH_COMPOSE_PROJECT_NAME: ${PDH_COMPOSE_PROJECT_NAME:-pdh-server}
      PDH_UPDATE_AGENT_TOKEN: ${PDH_UPDATE_AGENT_TOKEN:?Set PDH_UPDATE_AGENT_TOKEN in .env.docker}
    volumes:
      - ${PDH_UPDATE_HOST_REPO_DIR:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pdh_database:
  pdh_uploads:
  pdh_chat_files:
  pdh_backups:
  pdh_config:
