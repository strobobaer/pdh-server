services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PDH_DATABASE_USER:-pdh}
      POSTGRES_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      POSTGRES_DB: ${PDH_DATABASE_NAME:-pdh}
    volumes:
      - pdh_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        PDH_BUILD_COMMIT: ${PDH_BUILD_COMMIT:-unknown}
    image: pdh-server:local
    restart: unless-stopped
    init: true
    stop_grace_period: 35s
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.docker
    environment:
      # In der Oberflaeche gepflegte Server-Einstellungen (Volume pdh_config)
      PDH_ENV_FILE: /app/config/pdh.env
      PDH_SERVER_HOST: 0.0.0.0
      PDH_SERVER_PORT: "8090"
      PDH_DATABASE_HOST: db
      PDH_DATABASE_PORT: "5432"
      PDH_DATABASE_USER: ${PDH_DATABASE_USER:-pdh}
      PDH_DATABASE_PASSWORD: ${PDH_DATABASE_PASSWORD:?Set PDH_DATABASE_PASSWORD in .env.docker}
      PDH_DATABASE_NAME: ${PDH_DATABASE_NAME:-pdh}
      PDH_DATABASE_SSLMODE: disable
      PDH_AUTH_JWTSECRET: ${PDH_AUTH_JWTSECRET:-} # darf nach „In die Datenbank übernehmen“ in .env.docker entfallen
      PDH_UPDATE_AGENT_URL: http://updater:8091
      PDH_UPDATE_AGENT_TOKEN: ${PDH_UPDATE_AGENT_TOKEN:?Set PDH_UPDATE_AGENT_TOKEN in .env.docker}
    ports:
      - "8090:8090"
    volumes:
      - pdh_uploads:/app/uploads
      - pdh_chat_files:/app/chat_files
      - pdh_backups:/app/backups
      - pdh_config:/app/config
      - pdh_logs:/app/logs
      # Netzlaufwerke: vom Updater eingebunden, hier sichtbar (Core-Einstellungen -> Netzlaufwerke)
      - type: bind
        source: ${PDH_MOUNT_HOST_DIR:-/srv/pdh-mounts}
        target: /mnt/pdh
        bind:
          propagation: rslave
          create_host_path: true

  updater:
    build:
      context: .
      dockerfile: Dockerfile
      target: updater
    image: pdh-updater:local
    restart: unless-stopped
    environment:
      PDH_UPDATE_LISTEN: 0.0.0.0:8091
      PDH_UPDATE_MODE: docker
      PDH_UPDATE_REPO_DIR: /repo
      PDH_COMPOSE_PROJECT_NAME: ${PDH_COMPOSE_PROJECT_NAME:-pdh-server}
      PDH_UPDATE_AGENT_TOKEN: ${PDH_UPDATE_AGENT_TOKEN:?Set PDH_UPDATE_AGENT_TOKEN in .env.docker}
      PDH_MOUNT_ROOT: /mnt/pdh
      PDH_MOUNT_UID: "10001"
      PDH_MOUNT_GID: "10001"
    # Netzlaufwerke einbinden (mount braucht CAP_SYS_ADMIN); der Dienst hat
    # ueber docker.sock ohnehin Root-Rechte auf dem Host.
    privileged: true
    volumes:
      - ${PDH_UPDATE_HOST_REPO_DIR:-.}:/repo
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${PDH_MOUNT_HOST_DIR:-/srv/pdh-mounts}
        target: /mnt/pdh
        bind:
          propagation: rshared
          create_host_path: true
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Statistik: Grafana mit der Datenquelle „PDH“ (Nur-Lese-Benutzer pdh_grafana,
  # vom PDH beim Start angelegt) und dem Dashboard „PDH Übersicht“.
  # Kacheln: Core → Grafana & Statistik. Passwörter erzeugen install-docker.sh
  # bzw. install_update.sh in .env.docker.
  grafana:
    image: grafana/grafana-oss:11.2.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PDH_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${PDH_GRAFANA_ADMIN_PASSWORD:-}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: ${PDH_GRAFANA_COOKIE_SAMESITE:-lax}
      GF_SECURITY_COOKIE_SECURE: ${PDH_GRAFANA_COOKIE_SECURE:-false}
      GF_SERVER_ROOT_URL: ${PDH_GRAFANA_ROOT_URL:-}
      GF_AUTH_ANONYMOUS_ENABLED: ${PDH_GRAFANA_ANONYMOUS:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_DEFAULT_LANGUAGE: de-DE
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      PDH_DATABASE_NAME: ${PDH_DATABASE_NAME:-pdh}
      PDH_GRAFANA_DB_PASSWORD: ${PDH_GRAFANA_DB_PASSWORD:-}
    volumes:
      - pdh_grafana:/var/lib/grafana
      - ${PDH_UPDATE_HOST_REPO_DIR:-.}/grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pdh_database:
  pdh_uploads:
  pdh_chat_files:
  pdh_backups:
  pdh_config:
  pdh_logs:
  pdh_grafana:
