<title>PDH 0.90.0 – klickbare Vorschau</title>
<style>
/* Layout: Kopfzeile, Reiterleiste, Menüband, Inhalt; links Bereichsleiste, rechts Copilot, unten Statuszeile.
   Farben und Maße stehen nur in den Variablen; Fiori/Fluent und hell/dunkel schalten nur diese um. */
:root{--font:"DM Sans","Segoe UI",system-ui,sans-serif;--stage:#cfd4da;--bg:#f3f4f6;--bg2:#fff;--text:#1d2d3e;--muted:#5e6c7a;--border:#d9dde2;--accent:#0064d9;--on-accent:#fff;--shadow-card:0 6px 20px rgba(13,28,45,.2);--r:4px;--rl:8px;--rt:0px;--tint:#e5effc;--hov:#edf0f3;--crit:#b00020;--critbg:#fdeaec;--warn:#8a5300;--warnbg:#fff0d0;--ok:#146b34;--okbg:#e1f3e7;color-scheme:light}
html[data-style="fluent"]{--font:"Segoe UI Variable","Segoe UI","DM Sans",system-ui,sans-serif;--bg:#f0f0f0;--bg2:#fcfcfc;--text:#1b1b1b;--muted:#616161;--border:#e0e0e0;--accent:#0f6cbd;--r:6px;--rl:8px;--rt:8px;--tint:#e3eef8;--hov:#ececec}
html[data-mode="dark"]{--stage:#07090b;--bg:#12171c;--bg2:#1b2229;--text:#e6eaee;--muted:#9aa7b4;--border:#313c47;--accent:#5aa5ff;--on-accent:#06131f;--shadow-card:0 8px 24px rgba(0,0,0,.6);--tint:#1b3350;--hov:#26303a;--crit:#ff8f9a;--critbg:#3f1d24;--warn:#f3bb62;--warnbg:#3b2e13;--ok:#84d6a0;--okbg:#17331f;color-scheme:dark}
html[data-style="fluent"][data-mode="dark"]{--bg:#202020;--bg2:#2b2b2b;--text:#f5f5f5;--muted:#a8a8a8;--border:#414141;--accent:#479ef5;--tint:#173a57;--hov:#383838}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--text);font:13px/1.4 var(--font);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ic{flex:none}
.mut{color:var(--muted)}
#stage{height:100%;display:flex;flex-direction:column}
#app{position:relative;flex:1;min-height:0;width:100%;max-width:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
#app.frame{flex:0 1 860px;margin-top:12px;border:1px solid var(--border);border-radius:var(--rl)}
#pv{flex:none;height:44px;display:flex;align-items:center;gap:8px;padding:0 max(16px,env(safe-area-inset-left,0px));color:var(--text);font-size:12px;overflow-x:auto;white-space:nowrap}
#pv .seg button{height:28px}
/* Kopfzeile */
#top{flex:none;display:flex;align-items:center;gap:4px;height:48px;padding:0 8px;background:var(--bg2);border-bottom:1px solid var(--border)}
.logo{flex:none;font-weight:700;font-size:16px;letter-spacing:.04em;padding:0 8px}
.srch{flex:1;max-width:520px;margin:0 auto;height:32px;display:flex;align-items:center;gap:8px;padding:0 10px;background:var(--bg);border:1px solid var(--border);border-radius:var(--r);color:var(--muted);text-align:left}
.srch span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
kbd{font:12px var(--font);border:1px solid var(--border);border-radius:3px;padding:0 5px;background:var(--bg2)}
.sp{flex:1}
.ib{flex:none;width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;border-radius:var(--r);position:relative}
.ib:hover,.ib.on{background:var(--hov)}
.ib.on{color:var(--accent)}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--crit)}
.clock{flex:none;font-size:13px;font-variant-numeric:tabular-nums;padding:0 8px;white-space:nowrap}
.user{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 6px;background:transparent;border:0;border-radius:var(--r);white-space:nowrap}
.user:hover{background:var(--hov)}
.av{width:28px;height:28px;border-radius:50%;background:var(--tint);color:var(--accent);display:grid;place-items:center;font-size:12px;font-weight:600}
/* Hauptbereich */
#body{flex:1;min-height:0;display:flex;position:relative}
#rail{flex:none;width:72px;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:4px 0;overflow-y:auto}
.ra{height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:0;color:var(--muted);font-size:12px;margin:0 4px;border-radius:var(--r)}
.ra:hover{background:var(--hov)}
.ra.on{background:var(--tint);color:var(--accent);font-weight:600}
#center{flex:1;min-width:0;display:flex;flex-direction:column}
#tabs{flex:none;display:flex;align-items:flex-end;gap:2px;padding:6px 8px 0;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:34px;display:flex;align-items:center;border-radius:var(--rt) var(--rt) 0 0;color:var(--muted);border-bottom:2px solid transparent}
.tab>button{height:100%;background:transparent;border:0;padding:0 12px;white-space:nowrap;color:inherit;display:flex;align-items:center;gap:6px}
.tab>button.tx{padding:0 6px 0 0;width:28px;justify-content:center}
.tab:hover{background:var(--hov)}
.tab.on{background:var(--bg2);color:var(--text);font-weight:600;border-bottom-color:var(--accent)}
.tsep{flex:none;width:1px;height:18px;background:var(--border);margin:0 6px 8px}
#ribbon{flex:none;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.rtabs{display:flex;gap:2px;padding:0 8px}
.rt{height:30px;padding:0 12px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted)}
.rt.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.rbody{display:flex;overflow-x:auto;padding:2px 8px 4px;min-height:84px}
.grp{flex:none;display:flex;flex-direction:column;justify-content:space-between;padding:0 6px;border-right:1px solid var(--border)}
.grp:last-child{border-right:0}
.gbtns{display:flex;gap:2px}
.gl{text-align:center;font-size:12px;color:var(--muted);height:16px;line-height:16px}
.rb{flex:none;min-width:60px;max-width:92px;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 6px;background:transparent;border:1px solid transparent;border-radius:var(--r);font-size:12px;line-height:14px;text-align:center}
.rb:hover{background:var(--hov)}
.rb.on{background:var(--tint);border-color:var(--accent);color:var(--accent)}
.rnote{padding:12px 8px;color:var(--muted)}
.rph{display:flex;padding:2px 4px}
.rph .rb{flex:1;max-width:none}
#content{flex:1;min-height:0;overflow:auto;background:var(--bg)}
#content.fit{overflow:hidden;background:var(--bg2)}
/* Pillen */
.pill{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:var(--r);font-size:12px;white-space:nowrap;background:var(--bg);border:1px solid var(--border);color:var(--text)}
.p-hoch{background:var(--critbg);color:var(--crit);border-color:transparent;font-weight:600}
.p-nie{background:transparent;border-color:transparent;color:var(--muted);padding:0 2px}
.s-arb{background:var(--tint);color:var(--accent);border-color:transparent}
.s-war{background:var(--warnbg);color:var(--warn);border-color:transparent}
.s-erl{background:var(--okbg);color:var(--ok);border-color:transparent}
.pills{display:flex;gap:4px;flex:none;align-items:center}
/* Schaltflächen */
.btn{height:32px;padding:0 12px;border:1px solid var(--border);background:var(--bg2);border-radius:var(--r);white-space:nowrap}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:var(--r);overflow:hidden;background:var(--bg2);flex:none}
.seg button{height:30px;padding:0 10px;border:0;background:transparent;border-right:1px solid var(--border);white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tint);color:var(--accent);font-weight:600}
/* Arbeitsliste */
.wk{display:flex;height:100%}
.fold{flex:none;width:216px;border-right:1px solid var(--border);overflow:auto;padding:8px;background:var(--bg)}
.fold h3,.fh{font-size:12px;color:var(--muted);font-weight:600;padding:8px 8px 4px;text-transform:uppercase;letter-spacing:.04em}
.fi{width:100%;display:flex;align-items:center;gap:6px;height:32px;padding-right:8px;background:transparent;border:0;border-radius:var(--r);text-align:left;white-space:nowrap}
.fi:hover{background:var(--hov)}
.fi.on{background:var(--tint);color:var(--accent);font-weight:600}
.fi span:first-of-type{flex:1;overflow:hidden;text-overflow:ellipsis}
.fi small{font-size:12px;color:var(--muted)}
.lp{flex:none;width:min(440px,42%);min-width:300px;display:flex;flex-direction:column;border-right:1px solid var(--border);background:var(--bg2)}
.nar .lp,.vl .lp{width:100%;flex:1;border-right:0}
.dp{flex:1;min-width:0;overflow:auto;container-type:inline-size}
.ft{flex:none;display:flex;gap:2px;padding:0 8px;overflow-x:auto;border-bottom:1px solid var(--border)}
.ft button{flex:none;height:36px;padding:0 10px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}
.ft button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.ft b{font-weight:400;margin-left:4px;color:var(--muted)}
.lt{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.lt select{height:30px;border:1px solid var(--border);background:var(--bg2);border-radius:var(--r);padding:0 6px;max-width:100%;min-width:0}
.lscroll{flex:1;min-height:0;overflow:auto}
.gh{width:100%;display:flex;align-items:center;gap:6px;height:32px;padding:0 12px;background:var(--bg);border:0;border-bottom:1px solid var(--border);text-align:left;font-size:12px;color:var(--muted)}
.gh b{color:var(--text);font-weight:600}
.gh .gp{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gh .cnt{flex:none;font-variant-numeric:tabular-nums}
.gh svg{transition:transform .12s}
.gh[aria-expanded="false"] svg{transform:rotate(-90deg)}
.row{display:flex;flex-direction:column;gap:2px;padding:6px 12px;min-height:50px;border-bottom:1px solid var(--border);cursor:pointer;background:transparent;width:100%;text-align:left;border-left:0;border-right:0;border-top:0}
.row:hover{background:var(--hov)}
.row.sel{background:var(--tint)}
.r1,.r2{display:flex;align-items:center;gap:8px;min-width:0}
.rt1{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:500}
.rtime{flex:none;font-size:12px;color:var(--muted)}
.rid{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.rpath{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;padding:12px}
.tiles .row{border:1px solid var(--border);border-radius:var(--rl)}
.empty{padding:24px 16px;color:var(--muted)}
/* Detail */
.dh{padding:16px 16px 8px}
.dno{font-size:12px;color:var(--muted)}
.dh h2{font-size:20px;font-weight:600;margin:2px 0 8px;line-height:1.25}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 16px;margin:12px 0 0}
.facts dt{font-size:12px;color:var(--muted)}
.facts dd{margin:0;font-size:14px}
.dtabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg2);z-index:1}
.dtabs button{flex:none;height:38px;padding:0 10px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted)}
.dtabs button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.dbody{padding:16px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.dbody h3{font-size:14px;font-weight:600}
.back{display:flex;align-items:center;gap:4px;height:44px;padding:0 8px;background:var(--bg2);border:0;border-bottom:1px solid var(--border);width:100%;text-align:left;color:var(--accent);font-size:14px}
.chk{display:flex;align-items:center;gap:8px;min-height:32px}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.cm{display:flex;gap:8px}
.cm .av{flex:none}
.cm p{margin-top:2px}
.tl{display:flex;flex-direction:column;gap:8px;border-left:1px solid var(--border);margin-left:6px;padding-left:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f select,label.f input,.dlg select,.dlg input{height:34px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg2);padding:0 8px;font-size:14px;color:var(--text)}
.lnk{background:transparent;border:0;padding:0;color:var(--accent);text-align:left;text-decoration:underline}
/* Startseite */
.pg{padding:16px;display:flex;flex-direction:column;gap:12px}
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ph h1{font-size:20px;font-weight:600}
.tiles2{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.tile{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);min-height:64px}
.tile:hover{background:var(--hov)}
.tile svg{color:var(--accent);margin-top:2px}
.tile b{display:block;font-size:14px;font-weight:600}
.tile small{color:var(--muted);font-size:12px}
.wg{display:grid;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));gap:12px}
.w{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);display:flex;flex-direction:column;min-height:176px;min-width:0}
.cust .w{border-style:dashed;border-color:var(--accent)}
.wh{display:flex;align-items:center;gap:4px;padding:8px 8px 8px 12px;border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
.wh span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wh .ib{width:28px;height:28px}
.wb{padding:4px 0;flex:1;min-height:0;overflow:auto}
.wi{display:flex;align-items:center;gap:8px;padding:6px 12px;min-height:34px;width:100%;background:transparent;border:0;text-align:left}
button.wi:hover{background:var(--hov)}
.wi span.g{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;background:var(--bg);border-radius:3px;overflow:hidden;flex:none;width:72px;border:1px solid var(--border)}
.bar i{display:block;height:100%;background:var(--crit)}
.qs{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px;padding:8px 12px}
.qa{padding:6px 8px;border:1px solid var(--border);border-radius:var(--r);font-size:12px;display:flex;flex-direction:column;background:var(--bg)}
.qa b{font-size:13px;font-weight:600}
.qa.crit{background:var(--critbg);color:var(--crit);border-color:transparent}
.qa.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.cal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--border);margin:8px 12px;border:1px solid var(--border)}
.cal>div{background:var(--bg2);padding:6px;min-height:92px;font-size:12px;display:flex;flex-direction:column;gap:4px}
.cal b{font-size:12px}
.cal .ev{background:var(--tint);border-radius:3px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .today b{color:var(--accent)}
.wb textarea{width:calc(100% - 24px);margin:8px 12px;height:100px;resize:vertical;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:8px;font-size:14px}
.cbar{padding:8px 12px;background:var(--tint);border-radius:var(--r);color:var(--text)}
/* Tabellen */
.tw{overflow-x:auto;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl)}
.tbl{width:100%;border-collapse:collapse;min-width:520px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:8px 12px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl td{padding:0 12px;height:40px;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover{background:var(--hov)}
.tree{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:4px 0}
.tree div{display:flex;align-items:center;gap:8px;min-height:36px;padding-right:12px;border-bottom:1px solid var(--border)}
.tree div:last-child{border-bottom:0}
.tree .n{flex:1}
/* Dienste */
.ing{display:flex;flex-direction:column;height:100%;padding:12px;gap:8px}
.ing-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ing-fr{flex:1;min-height:240px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);overflow:auto;transition:opacity .2s}
.ing-fr.ld{opacity:.3}
.pnl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;padding:12px}
.pnl>div{border:1px solid var(--border);border-radius:var(--r);padding:8px 12px}
.pnl svg{width:100%;height:80px;color:var(--accent)}
/* Copilot */
#cop{flex:none;width:320px;background:var(--bg2);border-left:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.wm #cop,.phn #cop{position:absolute;right:0;top:0;bottom:0;width:min(360px,100%);z-index:30;box-shadow:var(--shadow-card)}
.ch{flex:none;display:flex;align-items:center;border-bottom:1px solid var(--border);padding-right:4px}
.ch .tabsx{flex:1;display:flex;overflow-x:auto}
.ch .tabsx button{flex:1;height:40px;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted)}
.ch .tabsx button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.cb{flex:1;min-height:0;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 12px;border-radius:var(--rl);background:var(--bg);border:1px solid var(--border)}
.msg.me{align-self:flex-end;background:var(--tint);border-color:transparent}
.msg ul{margin:4px 0;padding-left:18px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{height:28px;padding:0 10px;border:1px solid var(--border);background:var(--bg2);border-radius:14px}
.cin{flex:none;display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--border)}
.cin input{flex:1;min-width:0;height:36px;border:1px solid var(--border);border-radius:var(--r);background:var(--bg);padding:0 10px}
/* Status und Schnellwahl */
#status{flex:none;display:flex;align-items:center;gap:12px;height:28px;padding:0 12px;background:var(--bg2);border-top:1px solid var(--border);font-size:12px}
#stMsg{flex:0 1 auto;min-width:0;max-width:60%;height:100%;display:flex;align-items:center;background:transparent;border:0;padding:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
#stText{overflow:hidden;text-overflow:ellipsis}
#stProg{flex:1;max-width:240px;height:8px;border:1px solid var(--border);border-radius:4px;overflow:hidden;background:var(--bg)}
#stProg i{display:block;height:100%;background:var(--accent);transition:width .5s}
#stWarn{color:var(--warn);font-weight:600;white-space:nowrap;margin-left:auto}
#stVer{color:var(--muted);white-space:nowrap}
#bnav{display:none;flex:none;height:56px;background:var(--bg2);border-top:1px solid var(--border);padding-bottom:0}
#bnav button{flex:1;min-width:0;background:transparent;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
#bnav button.on{color:var(--accent);font-weight:600}
/* Überlagerungen */
#ov{position:absolute;inset:0;z-index:50;pointer-events:none}
#ov>*{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.28)}
.scrim.clear{background:transparent}
.pal,.dlg{position:absolute;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 16px));background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);box-shadow:var(--shadow-card)}
.pal{top:56px;max-height:calc(100% - 72px);display:flex;flex-direction:column;overflow:hidden}
.pal input{height:48px;border:0;border-bottom:1px solid var(--border);background:transparent;padding:0 16px;font-size:16px;outline:0}
.pal .pl{overflow:auto;padding:4px}
.pal .ph2{padding:8px 12px 2px;font-size:12px;color:var(--muted);font-weight:600}

 case 'area':{closeOv();const t=S.last[i]||NAV[i][2][0];go(t);break}
 case 'page':go(v);break;
 case 'rec':openRec(id);break;
 case 'tabx':closeRec(id);break;
 case 'closetab':if(kind()==='rec')closeRec(S.cur.slice(4));break;
 case 'sel':{S.sel[S.cur]=id;if(S.nar||e.detail>1&&0)S.mob=true;if(e.detail>1&&!S.nar){openRec(id);break}S.dtab='Übersicht';render();break}
 case 'back':S.mob=false;render();break;
 case 'gt':S.col.has(i)?S.col.delete(i):S.col.add(i);render();break;
 case 'filt':S.f=+v;render();break;
 case 'asset':S.asset=v===''?null:+v;S.mob=false;render();break;
 case 'g-on':S.grp=true;render();break;case 'g-off':S.grp=false;render();break;
 case 'v-split':case 'v-list':case 'v-tiles':S.vm=a.slice(2);render();break;
 case 'dtab':S.dtab=v;render();break;
 case 'rtab':S.rtab=v;render();break;
 case 'rmore':{const R=RB();menu(b,Object.keys(R).filter(t=>R[t]).map(t=>`<div class="mh">${t}</div>`+R[t].flatMap(g=>g[1]).map(x=>`<button class="mi${pressed(x[0])?' on':''}" data-act="${x[0]}">${I(x[2],18)}${x[1]}</button>`).join('')).join('<div class="msep"></div>'),{sheet:1});break}
 case 'mehr':menu(b,NAV.slice(4).map((n,k)=>`<button class="mi" data-act="area" data-i="${k+4}">${I(n[1],20)}${n[0]}</button>`).join(''),{sheet:1});break;
 case 'neu':if(kind()==='work'&&S.cur==='Tickets')dlgNew(true);else if(kind()==='work')dlgNew(false);else note(`Neu: ${S.cur} – in der Vorschau nur angedeutet`,1);break;
 case 'fault':dlgNew(false);break;
 case 'save':{const r=curRec();note(r?`Gespeichert: ${r.k} ${r.id}`:`Gespeichert: ${S.cur}`,1);break}
 case 'open':{const r=curRec();if(r)openRec(r.id);else note('Öffnen: Eintrag auswählen (Vorschau)',1);break}
 case 'zu':{const r=curRec();r?dlgAssign(r):note('Erst einen Vorgang auswählen',1);break}
 case 'wait':case 'done':{const r=curRec();if(!r){note('Erst einen Vorgang auswählen',1);break}r.s=a==='wait'?2:3;render();note(`Gespeichert: ${r.id} jetzt «${ST[r.s]}»`,1);break}
 case 'exp':case 'prt':case 'spalten':case 'fmerk':note(dummy[a],1);break;
 case 'kat':dlgStamm('kat','Kategorie hinzufügen','Kategorien');break;
 case 'lief':dlgStamm('lief','Lieferant hinzufügen','Lieferanten');break;
 case 'kst':dlgStamm('kst','Kostenstelle hinzufügen','Kostenstellen');break;
 case 'cust':S.cust=!S.cust;render();break;
 case 'wadd':{const have=S.widgets.map(w=>w.k),miss=Object.keys(WT).filter(k=>!have.includes(k));if(kind()!=='dash')go('Startseite');dlg('Widget hinzufügen',miss.length?`<label>Widget<select name="k">${miss.map(k=>`<option value="${k}">${WT[k]}</option>`).join('')}</select></label><label>Breite<select name="w"><option value="1">1 Spalte</option><option value="2" selected>2 Spalten</option><option value="3">3 Spalten</option><option value="4">4 Spalten</option></select></label>`:'<p>Alle Widgets sind schon auf der Seite.</p>','Hinzufügen',f=>{if(!miss.length)return;const x=new FormData(f);S.widgets.push({k:x.get('k'),w:+x.get('w')});S.cust=true;render();note('Widget hinzugefügt: '+WT[x.get('k')],1)});break}
 case 'wreset':S.widgets=WDEF.map(x=>({...x}));render();note('Startseite zurückgesetzt',1);break;
 case 'wdel':S.widgets.splice(i,1);render();break;
 case 'wgr':S.widgets[i].w=Math.min(4,S.widgets[i].w+1);render();break;
 case 'wsh':S.widgets[i].w=Math.max(1,S.widgets[i].w-1);render();break;
 case 'role':S.role=v;render();break;
 case 'tile':{const t=TILES[S.role][i][3];if(t==='fault')dlgNew(false);else if(t==='lief')dlgStamm('lief','Lieferant hinzufügen','Lieferanten');else if(t==='upd')runUpd();else if(t.startsWith('p:'))go(t.slice(2));else note(t.slice(2),1);break}
 case 'st-fiori':S.style='fiori';applyTheme();render();break;case 'st-fluent':S.style='fluent';applyTheme();render();break;
 case 'm-light':S.mode='light';applyTheme();render();break;case 'm-dark':S.mode='dark';applyTheme();render();break;
 case 'upd':closeOv();runUpd();break;
 case 'warn':S.warn=!S.warn;render();break;
 case 'reload':{const f=$('#ingfr');if(f){f.classList.add('ld');setTimeout(()=>f.classList.remove('ld'),500)}note(S.cur+' wurde neu geladen',1);break}
 case 'ext':note('Würde '+S.cur+' in einem neuen Fenster öffnen (Vorschau)',1);break;
 case 'cop':S.cop=!S.cop;$('#cop').hidden=!S.cop;$('#bcop').classList.toggle('on',S.cop);$('#bcop').setAttribute('aria-pressed',S.cop);if(S.cop)copRender();break;
 case 'ctab':S.ctab=v;copRender();break;
 case 'cq':ask(v);break;
 case 'x':note(b.dataset.t,1);closeOv();break;
 case 'bell':menu(b,`<div class="mh">Benachrichtigungen</div><button class="mi" data-act="rec" data-id="ST-10483">${I('warn',18)}<span>ST-10483 Kühlwasser zu warm<br><span class="mut">vor 8 Min</span></span></button><button class="mi" data-act="rec" data-id="ST-10482">${I('user',18)}<span>K. Berger arbeitet an ST-10482<br><span class="mut">vor 12 Min</span></span></button><button class="mi" data-act="page" data-v="Wartung">${I('tool',18)}<span>W-5521 Jahreswartung heute fällig<br><span class="mut">06:00</span></span></button>`,{right:1,sheet:1});break;
 case 'user':menu(b,`<div class="mh">K. Berger · ${S.role}</div><button class="mi" data-act="x" data-t="Profil (Vorschau)">${I('user',18)}Mein Profil</button><button class="mi" data-act="darst">${I('palette',18)}Darstellung</button><div class="msep"></div><button class="mi" data-act="x" data-t="Du wechselst zur klassischen Oberfläche (bis 0.90.0), nur in der Vorschau.">${I('back',18)}Klassische Oberfläche (bis 0.90.0)</button><button class="mi" data-act="x" data-t="Abmelden (Vorschau)">${I('x',18)}Abmelden</button>`,{right:1,sheet:1});break;
 case 'darst':S.rtab='Darstellung';closeOv();render();break;
 case 'log':menu(b,`<div class="mh">Letzte Meldungen</div>${S.log.length?S.log.map(l=>`<div class="mi" style="min-height:32px"><span class="mut">${l[0]}</span><span>${E(l[1])}</span></div>`).join(''):'<div class="mi mut">Noch keine Meldungen.</div>'}`,{up:1,sheet:1});break;
 case 'aw':{S.aw=v;if(v!=='desktop'&&S.cop){S.cop=false;$('#cop').hidden=true;$('#bcop').classList.remove('on')}const w={desktop:'100%',tablet:'768px',phone:'390px'}[v];app.style.width=w;app.classList.toggle('frame',v!=='desktop');closeOv();measure();render();break}
 }}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;if(b.tagName==='A')e.preventDefault();act(b.dataset.act,b,e)});
document.addEventListener('change',e=>{const s=e.target.closest('[data-chg]');if(s&&s.dataset.chg==='asset'){S.asset=s.value===''?null:+s.value;render()}});
document.addEventListener('dblclick',e=>{});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();return}if(e.key==='Escape')closeOv()});
/* Größe */
function measure(){const w=app.clientWidth,c=w>=1000?'wl':w>=600?'wm':'phn',cw=center.clientWidth,nar=cw<600,wide=cw>=1000;
 const ch=c!==S.cls||nar!==S.nar||wide!==S.cw;S.cls=c;S.nar=nar;S.cw=wide;
 app.classList.remove('wl','wm','phn');app.classList.add(c);$('#bsrch').hidden=c!=='phn';$('#srch').hidden=c==='phn';$('#topsp').hidden=c!=='phn';
 if(ch){if(!nar)S.mob=false;render()}}
S.aw='desktop';
try{if(matchMedia('(prefers-color-scheme: dark)').matches)S.mode='dark'}catch(e){}
applyTheme();top();tick();setInterval(tick,15000);
new ResizeObserver(()=>measure()).observe(app);new ResizeObserver(()=>measure()).observe(center);
setStatus();measure();render();
S.log.unshift(['07:12','Anmeldung als K. Berger']);
})();
</script>
