<style>
/* Vorschau zu Entwurf 0.90.0 Abschnitt 11 und 12. Farben und Maße nur über Variablen. */

[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--stage);color:var(--text);font:13px/1.4 var(--font);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}

.rt{flex:none;height:34px;padding:0 12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap}

.grp{flex:none;display:flex;flex-direction:column;padding:0 6px;border-right:1px solid var(--border)}
.grp:last-child{border-right:0}

.rb.on{background:var(--tint);color:var(--accent)}

.rb[disabled]{opacity:.45;cursor:default}

.rb .ic{width:var(--ics);height:var(--ics)}

.cnt{position:absolute;top:2px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;line-height:16px;font-weight:700;padding:0 4px}

.rs .ic{width:16px;height:16px}

.b{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:600;background:var(--hov);white-space:nowrap}

.li{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border)}
.li:first-of-type{border-top:0}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile{border-radius:var(--rl);padding:14px;border:1px solid var(--border);background:var(--bg2)}
.tile.crit{border-color:var(--crit);background:var(--critbg)}.tile.warn{border-color:var(--warn);background:var(--warnbg)}
.tile b{display:block;font-size:15px;margin-bottom:4px}
.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.chips button{border:1px solid var(--border);background:var(--bg2);border-radius:14px;padding:3px 10px}
.chips button.on{background:var(--tint);border-color:var(--accent);color:var(--accent);font-weight:600}
.lst{display:grid;grid-template-columns:220px minmax(0,1fr);gap:12px}
.tree{padding:8px}
.tree button{display:block;width:100%;text-align:left;background:none;border:0;border-radius:var(--r);padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree button:hover{background:var(--hov)}
.tree button.on{background:var(--tint);color:var(--accent);font-weight:600}
.gh{display:flex;gap:8px;padding:7px 12px;background:var(--bg);border-top:1px solid var(--border);font-weight:600}
.gh:first-child{border-top:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto 70px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--border);cursor:pointer}

.tbl{width:100%;border-collapse:collapse}

.tbl th{font-size:12px;color:var(--muted);font-weight:600;border-top:0}

.err{color:var(--crit)}
.sec{margin-bottom:12px}
.sec h3{font-size:14px;color:var(--text);margin-bottom:8px}
.fr{display:grid;grid-template-columns:240px minmax(0,1fr);gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--border)}
.fr:first-of-type{border-top:0}
input[type=text],input[type=time],input[type=date],input[type=number],select,textarea{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:5px 8px;min-width:0}

</style>
</head>

function say(t,prog){$('#stxt').textContent=t;const b=$('#sbar');if(prog){b.hidden=false;const i=b.firstChild;i.style.width='0';requestAnimationFrame(()=>requestAnimationFrame(()=>{i.style.width='100%'}));setTimeout(()=>{b.hidden=true},800)}}
const isFav=()=>S.favs.some(f=>f.a===S.area&&f.p===S.page);
function go(a,p,d){S.area=a;S.page=p||areaOf(a).home;S.tab=S.page;S.detail=!!d;S.editing=false;S.dirty=false;S.rowEdit=false;closeDlg();render()}
/* Bearbeitungsschritte bis zum Speichern: Rückgängig nimmt den letzten zurück; beim Wechseln oder
   Verlassen wird nachgefragt – ohne Bestätigung werden die Eingaben verworfen */
let pendingNav=null;
function change(entry,msg){S.hist.push(entry);S.dirty=true;render();say(msg+' – noch nicht gespeichert.')}
function undoOne(){const h=S.hist.pop();if(!h)return;if(h.t==='w')S.hidden=S.hidden.filter(x=>x!==h.id);else if(h.t==='st')S.rowStat[h.nr]=h.old;S.dirty=S.hist.length>0}
function revertAll(){while(S.hist.length)undoOne();S.editing=false;S.rowEdit=false;S.dirty=false}
function needsAsk(k,el){if(!S.hist.length)return false;if(k==='area'||k==='go'||k==='logout')return true;if(k==='tab'&&el){const t=el.dataset.k;return(t==='einst'||area().bands.some(b=>b.k===t))&&t!==S.page}return false}
function askSave(then){pendingNav=then;dlg('<h3>Änderungen speichern?</h3><p>Auf „'+pageInfo().l+'“ '+(S.hist.length===1?'ist 1 Änderung noch nicht gespeichert. Ohne Bestätigung wird sie verworfen.':'sind '+S.hist.length+' Änderungen noch nicht gespeichert. Ohne Bestätigung werden sie verworfen.')+'</p><div class="ft"><button class="btn" data-act="ask-discard">Verwerfen</button><button class="btn pri" data-act="ask-save">Speichern</button></div>')}
function dismiss(){if(pendingNav){const f=pendingNav;pendingNav=null;revertAll();closeDlg();f();say('Nicht bestätigt – Eingaben verworfen.');return}closeDlg();draft=null}
function act(a,el){
 const i=a.indexOf(':');const k=i<0?a:a.slice(0,i),v=i<0?'':a.slice(i+1);
 closeMenu();
 if(needsAsk(k,el))return askSave(()=>act(a,el));
 switch(k){
 case 'undo':{const n=S.hist.length;undoOne();render();return say(n?'Rückgängig: letzter Schritt zurückgenommen ('+S.hist.length+' übrig).':'Nichts rückgängig zu machen.')}
 case 'ask-save':{const f=pendingNav;pendingNav=null;S.hist=[];S.editing=false;S.rowEdit=false;S.dirty=false;closeDlg();if(f)f();return say('Gespeichert.',1)}
 case 'ask-discard':return dismiss();
 case 'noop':return;
 case 'area':return go(el.dataset.a);
 case 'go':if(!v&&el&&el.dataset.a)return go(el.dataset.a,el.dataset.p);{const p=v.split(':');return go(p[0],p[1],p[2]==='d')}
 case 'tab':{const t=el.dataset.k;if(!S.logged)return;if(t==='einst'||area().bands.some(b=>b.k===t)){if(S.page!==t){S.page=t;S.detail=false;S.editing=false;S.dirty=false;S.rowEdit=false}}S.tab=t;return render()}
 case 'clock':if(!S.logged)return;return go('start','zeit');
 case 'login':S.logged=true;return go('start','dash');
 case 'logout':S.logged=false;S.side='';S.timer=0;S.page='leit';S.tab='leit';S.area='start';S.editing=false;S.detail=false;closeDlg();render();return say('Abgemeldet – die Sitzung gilt auch als Kopie nicht mehr.');
 case 'me':return menu(el,'<div class="mh">Alex Beispiel · Schichtleiter</div>'+mi('noop','Mein Konto','users')+'<div class="mh">Sprache</div>'+mi('noop','Deutsch','',1)+mi('noop','English','')+'<div class="msep"></div><div class="mh">Oberfläche (bis 0.90.0)</div>'+mi('noop','Neu','',1)+mi('noop','Klassisch','')+'<div class="msep"></div>'+mi('logout','Abmelden','login'));
 case 'new':return wizard();
 case 'wiz':closeDlg();return say('Assistent „'+v+'“ geöffnet (in der Vorschau nicht weiter).');
 case 'assign':return menu(el,'<div class="mh">Offen ohne Zuweisung (3)</div>'+mi('go:vorg:stoer:d','ST-10479 · Sensor B3 verschmutzt','bell')+mi('go:vorg:tick:d','TK-3391 · Drucker Halle 3 offline','inbox')+mi('go:vorg:aufg:d','AU-0912 · Ölstand prüfen','check')+'<div class="msep"></div>'+mi('noop','Mir zuweisen','users')+mi('noop','Zuweisen an …','users'));
 case 'opened':return menu(el,'<div class="mh">Geöffnete Vorgänge</div>'+(S.open.length?S.open.map(o=>mi('go:vorg:'+(o.nr.charAt(0)==='T'?'tick':'stoer')+':d',o.nr+' · '+o.t,'open')).join('')+'<div class="msep"></div>'+mi('closeall','Alle schließen','x'):'<div class="mh">keine</div>'));
 case 'closeall':S.open=[];render();return say('Geöffnete Vorgänge geschlossen.');
 case 'timer':if(S.timer){const m=Math.max(1,Math.round((Date.now()-S.timer)/60000));S.zeit.unshift({d:'Heute',von:hm(new Date(S.timer)),bis:hm(new Date()),dur:'0 h '+pad(m)+' min',vg:'ohne Vorgang'});S.timer=0;render();return say('Zeit gestoppt und gebucht (ohne Vorgang – in der Übersicht zuordnen).',1)}S.timer=Date.now();render();return say('Zeit läuft seit '+hm(new Date())+'.');
 case 'manual':return actionDlg('zeit');
 case 'material':return actionDlg('mat');
 case 'book-time':closeDlg();return say('Gebucht: 1 h 30 min am 26.11.2026.',1);
 case 'book-mat':closeDlg();return say('Gebucht: 1 × Kette ET-4471 aus Halle 1 Fach 7 für ST-10482.',1);
 case 'search':return palette();
 case 'cop':S.side=S.side==='cop'?'':'cop';return render();
 case 'help-page':S.side=S.side==='help'?'':'help';return render();
 case 'bell':return menu(el,'<div class="mh">Benachrichtigungen</div>'+mi('go:vorg:stoer:d','ST-10482 wurde dir zugewiesen','bell')+mi('noop','Wartung Kompressor heute fällig','set'));
 case 'chat':return say('Chat öffnet in der rechten Leiste (in der Vorschau nicht enthalten).');
 case 'share':return say('„Im Chat teilen“ – in der Vorschau nicht enthalten.');
 case 'refresh':return say('Aktualisiert.',1);
 case 'print':return printDlg();
 case 'doprint':closeDlg();return say('An „Büro Halle 1“ geschickt.',1);
 case 'pdf':closeDlg();return say('PDF erstellt.',1);
 case 'fav':if(isFav())S.favs=S.favs.filter(f=>!(f.a===S.area&&f.p===S.page));else S.favs.push({a:S.area,p:S.page});return render();
 case 'edit':S.editing=!S.editing;render();return say(S.editing?'Bearbeiten: Widgets ziehen, × entfernt, „Widget hinzufügen“.':'Bearbeiten beendet – noch nicht gespeichert.');
 case 'addw':return say('Widget-Katalog öffnet (in der Vorschau nicht enthalten).');
 case 'rmw':return change({t:'w',id:el.closest('.card').dataset.w},'Widget entfernt');
 case 'cancel':revertAll();render();return say('Abgebrochen – alle Schritte seit dem letzten Speichern verworfen.');
 case 'rowedit':S.rowEdit=true;S.tab='start';render();return say('Bearbeiten in der Liste: „Speichern“ und „Abbrechen“ stehen jetzt im Band Start.');
 case 'save':S.hist=[];S.dirty=false;S.editing=false;S.rowEdit=false;render();return say('Gespeichert: '+pageInfo().l+'.',1);
 case 'reset':S.editing=false;S.dirty=false;render();return say('Auf die Vorgabe zurückgesetzt.');
 case 'standard':return dlg('<h3>Als Standard für alle setzen?</h3><p>Die jetzige Anordnung von „'+pageInfo().l+'“ wird die Vorgabe der Firma. Wer seine Seite schon angepasst hat, behält sie, bis er „Auf Vorgabe zurücksetzen“ drückt.</p><div class="ft"><button class="btn" data-act="close">Abbrechen</button><button class="btn pri" data-act="std-ok">Für alle setzen</button></div>');
 case 'std-ok':closeDlg();return say('Vorgabe der Firma gesetzt: '+pageInfo().l+'.',1);
 case 'full':return say('Vollbild ohne Rahmen – wie heute an Wandbildschirmen.');
 case 'openrow':S.detail=true;S.tab=S.page;{const nr=(pre[S.page]||'NR')+'-10482';if(!S.open.some(o=>o.nr===nr))S.open.push({nr:nr,t:'Kettenriss am Auslaufband'})}return render();
 case 'back':S.detail=false;return render();
 case 'dtab':S.dtab=v;return render();
 case 'wait':return say('Auf „Warten“ gesetzt (Grund wird abgefragt).');
 case 'complete':return say('Fertigstellen-Assistent geöffnet (in der Vorschau nicht weiter).');
 case 'filter':S.filter=v;return render();
 case 'period':S.period=v;return render();
 case 'today':return say('Heute.');
 case 'grp':S.grpInfra=!S.grpInfra;return render();
 case 'm-look':return menu(el,'<div class="mh">Stil</div>'+mi('set:style:fiori','Fiori','',S.style==='fiori')+mi('set:style:fluent','Fluent','',S.style==='fluent')+'<div class="mh">Modus</div>'+mi('set:mode:light','Hell','',S.mode==='light')+mi('set:mode:dark','Dunkel','',S.mode==='dark')+mi('set:mode:sys','Wie System','')+'<div class="mh">Farbschema</div>'+mi('set:accent:','Blau','',!S.accent)+mi('set:accent:#00788a','Petrol','',S.accent==='#00788a')+mi('set:accent:#2d7d46','Grün','',S.accent==='#2d7d46')+'<div class="mh">Dichte</div>'+mi('set:density:kompakt','Kompakt','',S.density==='kompakt')+mi('set:density:normal','Normal','',S.density==='normal')+mi('set:density:beruehrung','Berührung','',S.density==='beruehrung'));
 case 'm-adjust':return menu(el,mi('order','Bereiche ordnen …','arrows')+mi('fav',isFav()?'Favorit entfernen':'Diese Seite als Favorit','star')+mi('go:start:dash','Startseite anpassen','dash')+(admin()?'<div class="msep"></div>'+mi('assignfirm','Zuordnung der Firma …','users'):''));
 case 'set':{const j=v.indexOf(':');const p=v.slice(0,j),val=v.slice(j+1);if(p==='mode'&&val==='sys')S.mode=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';else S[p]=val;return render()}
 case 'order':return orderDlg();
 case 'ord-up':case 'ord-down':{const x=S.order.indexOf(v),y=k==='ord-up'?x-1:x+1;if(x>=0&&y>=0&&y<S.order.length){const t=S.order[x];S.order[x]=S.order[y];S.order[y]=t}render();return orderDlg()}
 case 'ord-reset':S.order=DEFAULT.map(a=>a.k);render();return orderDlg();
 case 'assignfirm':S.zoSel=-1;return firmDlg();
 case 'zo-add':{const s=$('#zoAll').value;if(!s)return say('Links eine Seite wählen.');const b=clone(DEFAULT.flatMap(a=>a.bands).find(x=>x.k===s));const a=draft.find(x=>x.k===(S.zoArea||'start'));if(a.bands.some(x=>x.k===s))return say('Steht schon in diesem Bereich.');a.bands.push(b);S.zoSel=a.bands.length-1;return firmDlg()}
 case 'zo-rm':case 'zo-up':case 'zo-down':case 'zo-ren':{const a=draft.find(x=>x.k===(S.zoArea||'start'));const x=S.zoSel;if(x==null||x<0||!a.bands[x])return say('Rechts ein Band wählen.');if(k==='zo-rm'){if(a.bands.length<2)return say('Ein Bereich braucht mindestens ein Band.');a.bands.splice(x,1);S.zoSel=-1}else if(k==='zo-ren'){const n=prompt('Neuer Name für „'+a.bands[x].l+'“',a.bands[x].l);if(n&&n.trim())a.bands[x].l=n.trim()}else{const y=k==='zo-up'?x-1:x+1;if(y<0||y>=a.bands.length)return;const t=a.bands[x];a.bands[x]=a.bands[y];a.bands[y]=t;S.zoSel=y}return firmDlg()}
 case 'zo-default':draft=clone(DEFAULT);return firmDlg();
 case 'zo-cancel':draft=null;return closeDlg();
 case 'zo-save':AREAS=draft;draft=null;AREAS.forEach(a=>{if(!a.bands.some(b=>b.k===a.home))a.home=a.bands[0].k});if(S.page!=='einst'&&!area().bands.some(b=>b.k===S.page)){S.page=area().home;S.tab=S.page;S.detail=false}closeDlg();render();return say('Zuordnung für alle gespeichert.',1);
 case 'close':return closeDlg();
 default:return say('„'+((el&&el.textContent.trim())||k)+'“ – in der Vorschau ohne Funktion.');
 }
}
document.addEventListener('click',e=>{
 if(e.target.closest('#pvbtn')){if(menuEl&&menuEl.querySelector('#pvset')){closeMenu();return}menu($('#pvbtn'),$('#pvtpl').innerHTML);syncPv();return}
 const pv=e.target.closest('#pvset .seg button');
 if(pv){const g=pv.parentElement.dataset.pv,v=pv.dataset.v;if(g==='logged'){act(v==='1'?'login':'logout',null)}else{S[g]=v;if(g==='role'&&v!=='admin'&&(S.area==='verw'||S.page==='einst'))go('start','dash');else render()}menu($('#pvbtn'),$('#pvtpl').innerHTML);syncPv();return}
 const t=e.target.closest('[data-act]');
 if(menuEl&&!e.target.closest('.menu')&&!t)closeMenu();
 if(e.target.id==='ov'){dismiss();return}
 if(t&&!t.disabled&&t.tagName!=='SELECT')act(t.dataset.act,t);
});
document.addEventListener('change',e=>{const s=e.target.closest('select[data-nr]');if(!s)return;change({t:'st',nr:s.dataset.nr,old:s.dataset.cur},'Geändert: '+s.dataset.nr+' → '+s.value);S.rowStat[s.dataset.nr]=s.value;render()});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'&&S.logged){e.preventDefault();palette()}
 else if(e.key==='Escape'){if(menuEl)closeMenu();else if(!$('#ov').hidden)dismiss()}
});
const pad=n=>String(n).padStart(2,'0');
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes());
function fmt(ms){const s=Math.floor(ms/1000);return Math.floor(s/3600)+':'+pad(Math.floor(s/60)%60)+':'+pad(s%60)}
function tick(){
 const d=new Date(),wd=['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()];
 $('#clock').innerHTML=(S.timer?'<span class="run" title="Zeit läuft"></span>':ic('clock',16))+wd+' '+pad(d.getDate())+'.'+pad(d.getMonth()+1)+'. '+hm(d)+':'+pad(d.getSeconds());
 if(S.timer){document.querySelectorAll('.rb .tmr').forEach(x=>{x.innerHTML=timerLabel()});const z=$('#zrun');if(z)z.textContent=fmt(Date.now()-S.timer)}
}
setInterval(tick,1000);
render();
</script>
</body>
</html>
