services:
  db:
    image: postgres:16-bookworm
    container_name: pdh-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pdh}
      POSTGRES_USER: ${POSTGRES_USER:-pdh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pdh-change-me}
      TZ: Europe/Berlin
    volumes:
      - pdh-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  pdh:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdh-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TZ: Europe/Berlin
      PDH_SERVER_HOST: 0.0.0.0
      PDH_SERVER_PORT: 8090
      PDH_SERVER_ENV: ${PDH_SERVER_ENV:-development}
      PDH_DATABASE_HOST: db
      PDH_DATABASE_PORT: 5432
      PDH_DATABASE_USER: ${POSTGRES_USER:-pdh}
      PDH_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-pdh-change-me}
      PDH_DATABASE_NAME: ${POSTGRES_DB:-pdh}
      PDH_DATABASE_SSLMODE: disable
      PDH_AUTH_JWTSECRET: ${PDH_AUTH_JWTSECRET:-change-me-minimum-32-characters-local-only}
      PDH_AUTH_TOKENDURATION: ${PDH_AUTH_TOKENDURATION:-24}
      PDH_COPILOT_BACKEND: ${PDH_COPILOT_BACKEND:-ollama}
      PDH_COPILOT_OLLAMAURL: ${PDH_COPILOT_OLLAMAURL:-http://host.docker.internal:11434}
      PDH_COPILOT_MODEL: ${PDH_COPILOT_MODEL:-llama3.2}
      PDH_COPILOT_ANTHROPICKEY: ${PDH_COPILOT_ANTHROPICKEY:-}
    ports:
      - "8090:8090"
    volumes:
      - pdh-uploads:/app/uploads
    healthcheck:
      test: ["CMD", "/app/pdh", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  pdh-postgres:
  pdh-uploads:
