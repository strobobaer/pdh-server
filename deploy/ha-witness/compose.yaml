# Zeuge für den PDH-Ausfallschutz als Container (z. B. auf einem dritten
# Rechner oder einem Raspberry Pi). Nicht auf einem der beiden Server betreiben.
#
# Erster Start (Code in der PDH-Oberfläche oder mit `pdh-ha join-code --witness`
# auf dem ersten Server erzeugen, 30 min gültig):
#   cd deploy/ha-witness
#   PDH_HA_JOIN='<Code>' PDH_HA_ADDR=<IP dieses Rechners> docker compose up -d --build
#   docker compose logs -f
# Danach genügt `docker compose up -d`; Schlüssel und Zustand liegen in den Volumes.
# Zustand ansehen: docker compose exec witness pdh-ha status
# Port 7480/tcp muss von beiden Servern aus erreichbar sein.
#
# Selbst-Update: Der Dienst "updater" (nur unter Docker) holt den Zeugen auf den
# Stand der beiden Server, sobald beide denselben Stand haben und kein Update
# läuft. Er klont das Repository ins Volume ha-src und baut nur den Dienst
# "witness" neu (gleicher Projektname, gleiche Volumes). Abschalten:
#   PDH_HA_AUTOUPDATE=0 docker compose up -d updater
name: pdh-ha-witness

services:
  witness:
    build:
      context: ../..
      dockerfile: deploy/ha-witness/Dockerfile
      target: witness
      args:
        COMMIT: ${PDH_HA_COMMIT:-}
    image: pdh-ha-witness:local
    hostname: ${HA_ID:-zeuge}
    restart: unless-stopped
    ports:
      - "7480:7480"
    environment:
      PDH_HA_JOIN: ${PDH_HA_JOIN:-}
      PDH_HA_ADDR: ${PDH_HA_ADDR:-}
      PDH_HA_ID: ${HA_ID:-}
    volumes:
      - ha-etc:/etc/pdh/ha
      - ha-state:/var/lib/pdh-ha

  # Helfer: zieht den Zeugen nach (updater.sh). Braucht den Docker-Socket des
  # Rechners; baut sich nie selbst neu (nur "witness").
  updater:
    build:
      context: ../..
      dockerfile: deploy/ha-witness/updater.Dockerfile
    image: pdh-ha-witness-updater:local
    restart: unless-stopped
    environment:
      PDH_HA_AUTOUPDATE: ${PDH_HA_AUTOUPDATE:-1}
      PDH_HA_REPO: ${PDH_HA_REPO:-https://github.com/strobobaer/pdh-server.git}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ha-src:/src

volumes:
  ha-etc:
  ha-state:
  ha-src:
