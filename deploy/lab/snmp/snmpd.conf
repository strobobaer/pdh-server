# Labor-Gegenstelle für SNMP v3 (nur zum Testen). Benutzer und Kennwörter gelten nur hier.
# Kein v1/v2c: es gibt keine "community"-Zeile.

sysName     pdh-lab-snmp
sysLocation Labor
sysContact  labor@example.invalid

# Benutzer: Name, Anmeldung + Kennwort, Verschlüsselung + Kennwort
createUser pdhlab     SHA-256 "Labor-Auth-2026" AES     "Labor-Priv-2026"
createUser pdhlab512  SHA-512 "Labor-Auth-2026" AES-256 "Labor-Priv-2026"
createUser pdhlabsha1 SHA     "Labor-Auth-2026" AES     "Labor-Priv-2026"

# nur lesen, nur angemeldet und verschlüsselt (authPriv)
rouser pdhlab     priv
rouser pdhlab512  priv
rouser pdhlabsha1 priv
