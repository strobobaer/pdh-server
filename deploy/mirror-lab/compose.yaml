# Spiegel-Labor – nur Testumgebung. Bedienung über mirror-lab.sh.
# pg1: PostgreSQL-Primary, pg2: Hot Standby (pg_basebackup -R von pg1).
# pdh1 arbeitet gegen pg1 (legt das Schema an), pdh2 gegen pg2 (Spiegel).
# Beide mit gleicher Einstellung (JWT-Secret, Einstellungsschlüssel). pdh2
# bekommt einen Platzhalter für den pdh-ha-Socket (fakeha).
name: pdh-mirror-lab

x-pg-env: &pg-env
  POSTGRES_USER: pdh
  POSTGRES_PASSWORD: pdh-lab
  POSTGRES_DB: pdh
  PGPASSWORD: pdh-lab

x-pdh-env: &pdh-env
  PDH_SERVER_ENV: production
  PDH_SERVER_PORT: "8090"
  PDH_DATABASE_PORT: "5432"
  PDH_DATABASE_USER: pdh
  PDH_DATABASE_PASSWORD: pdh-lab
  PDH_DATABASE_NAME: pdh
  PDH_DATABASE_SSLMODE: disable
  PDH_AUTH_JWTSECRET: lab-jwt-secret-0123456789abcdefghijklmnopqrstuv
  PDH_SETTINGS_KEY: lab-settings-key-0123456789abcdefghijklmnopqrst
  PDH_SKIP_UPDATE_BACKUP: "1"
  PDH_ENV_FILE: /app/lab.env

x-pdh: &pdh
  build:
    context: ../..
    dockerfile: deploy/mirror-lab/Dockerfile
    target: app
  image: pdh-mirror-lab:local
  restart: "no"
  init: true
  networks: [lab]

services:
  pg1:
    image: ${MIRROR_LAB_PG_IMAGE:-postgres:18}
    container_name: pdh-mirror-lab-pg1
    hostname: pg1
    environment: *pg-env
    # Replikation für pg2 freigeben (Init-Skript beim ersten Start)
    entrypoint:
      - bash
      - -c
      - |
        printf '%s\n' 'echo "host replication all all scram-sha-256" >> "$$PGDATA/pg_hba.conf"' > /docker-entrypoint-initdb.d/10-replikation.sh
        exec docker-entrypoint.sh postgres -c wal_level=replica -c max_wal_senders=10 -c hot_standby=on
    volumes:
      - pg1-data:/var/lib/postgresql
    networks: [lab]

  pg2:
    image: ${MIRROR_LAB_PG_IMAGE:-postgres:18}
    container_name: pdh-mirror-lab-pg2
    hostname: pg2
    environment: *pg-env
    # Erster Start: Grundsicherung von pg1 mit -R (Standby-Signal + Verbindung)
    entrypoint:
      - bash
      - -c
      - |
        set -e
        mkdir -p "$$PGDATA"
        chown postgres:postgres "$$PGDATA"
        chmod 700 "$$PGDATA"
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          until gosu postgres pg_basebackup -h pg1 -U pdh -D "$$PGDATA" -R -X stream -c fast; do
            echo "pg2: warte auf pg1 …"
            rm -rf "$$PGDATA"/*
            sleep 1
          done
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    volumes:
      - pg2-data:/var/lib/postgresql
    networks: [lab]

  pdh1:
    <<: *pdh
    container_name: pdh-mirror-lab-pdh1
    hostname: pdh1
    environment:
      <<: *pdh-env
      PDH_DATABASE_HOST: pg1

  pdh2:
    <<: *pdh
    container_name: pdh-mirror-lab-pdh2
    hostname: pdh2
    environment:
      <<: *pdh-env
      PDH_DATABASE_HOST: pg2
      PDH_HA_SOCKET: /run/pdh-ha/api.sock
      LAB_FAKE_HA: "1"

  # Crawler (go test -tags mirrorlab) – nur über „docker compose run crawler“
  crawler:
    build:
      context: ../..
      dockerfile: deploy/mirror-lab/Dockerfile
      target: src
    image: pdh-mirror-lab-src:local
    profiles: [werkzeug]
    working_dir: /src
    environment:
      PDH_MIRROR_URL: http://pdh2:8090
      CGO_ENABLED: "0"
    networks: [lab]

networks:
  lab:
    name: pdh-mirror-lab-net

volumes:
  pg1-data:
  pg2-data:
